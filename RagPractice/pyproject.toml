[project]
name = "RagPractice"
version = "0.1.0"
description = "A retrieval-augmented generation practice project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.14.3",
    "langchain>=1.3.13",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "sentence-transformers>=5.6.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Prevent setuptools from treating top-level data/ and notebook/ as packages
[tool.setuptools.packages.find]
exclude = ["data*", "notebook*"]
